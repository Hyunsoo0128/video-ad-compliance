[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-compliance"
version = "0.1.0"
description = "AI-powered video ad compliance and brand safety automation"
requires-python = ">=3.11"
dependencies = [
    "twelvelabs>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ad-compliance = "ad_compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
